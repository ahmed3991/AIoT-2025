; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_deps =
    adafruit/Adafruit Unified Sensor
    adafruit/DHT sensor library

; Same firmware for Proteus (.pio/build/uno_proteus/firmware.hex). The Proteus DHT22 model only answers a 20 ms
; start signal, so this build uses proteus/libraries/DHT_proteus: DHT sensor library 1.4.7 with that one change.
[env:uno_proteus]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_extra_dirs = proteus/libraries
